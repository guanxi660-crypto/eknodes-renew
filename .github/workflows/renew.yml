name: EkNodes Auto Renew

on:
  schedule:
    # 每 6 小时运行一次（UTC），可自行调整
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: eknodes-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run renew
        env:
          EK_EMAIL: ${{ secrets.EK_EMAIL }}
          EK_PASSWORD: ${{ secrets.EK_PASSWORD }}
          EK_RENEW_THRESHOLD_HOURS: ${{ secrets.EK_RENEW_THRESHOLD_HOURS }}
          TG_BOT: ${{ secrets.TG_BOT }}
        run: python renew.py
